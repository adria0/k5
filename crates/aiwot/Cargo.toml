[package]
edition = "2021"
name = "aiwot"
description = "Notarize and verify aiwot profiles with TLSNotary, and sign messages with a hybrid post-quantum key"
publish = false
version = "0.1.0"

[lints]
workspace = true

[dependencies]
notary-client = { workspace = true }
tlsn-common = { workspace = true }
tlsn-core = { workspace = true }
tlsn-formats = { workspace = true }
tlsn-prover = { workspace = true }
spansy = { workspace = true }
rangeset = { workspace = true }

base64 = { version = "0.22" }
bincode = { workspace = true }
bs58 = { version = "0.5" }
chrono = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2" }
fips203 = { version = "0.4.3", default-features = false, features = ["ml-kem-768"] }
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-44", "default-rng"] }
getrandom = { version = "0.2" }
hex = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "fs"] }
tokio-util = { workspace = true, features = ["compat"] }
toml = { workspace = true }
tracing-subscriber = { workspace = true }
x25519-dalek = { version = "2", features = ["static_secrets"] }
