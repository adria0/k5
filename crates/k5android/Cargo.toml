[package]
edition = "2021"
name = "k5android"
description = "k5 Android app: the k5 window (k5gui) as an Android activity, built with cargo-apk"
publish = false
version = "0.1.0"

[lints]
workspace = true

# Loaded by the Android activity (`android_main`).
[lib]
crate-type = ["cdylib"]

# Android only: elsewhere this is an empty library.
[target.'cfg(target_os = "android")'.dependencies]
anyhow = { workspace = true }
k5gui = { path = "../k5gui" }
k5lib = { path = "../k5lib" }
log = { workspace = true }
android_logger = { version = "0.15" }
slint = { version = "1.18", features = ["backend-android-activity-06"] }
# The camera (camera2ndk, image reader) and its permission (JNI), to read
# tickets from QR codes.
ndk-sys = { version = "0.6", features = ["media"] }
jni = { version = "0.22" }
ndk-context = { version = "0.1" }

# cargo-apk: `k5-android.sh` builds the APK in a Docker image.
[package.metadata.android]
package = "dev.k5.app"
apk_name = "k5"
# The launcher icon (generated by make-icon.py).
resources = "res"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

# Peer to peer (iroh) and the notary.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# iroh watches the network interfaces.
[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_WIFI_STATE"

# Reading tickets from QR codes; asked when first scanning.
[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

[[package.metadata.android.uses_feature]]
name = "android.hardware.camera"
required = false

[package.metadata.android.application]
label = "K5"
icon = "@mipmap/ic_launcher"
# So that `adb shell run-as dev.k5.app` can edit k5.toml (e.g. its [notary]
# section) until the app has a settings screen.
debuggable = true

[package.metadata.android.application.activity]
orientation = "portrait"
# Rotating or showing the keyboard resizes the window instead of restarting
# the app (and its peer-to-peer node).
config_changes = "orientation|screenSize|keyboardHidden|keyboard"
