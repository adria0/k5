[package]
edition = "2021"
name = "k5net"
description = "k5 peer-to-peer over iroh: private messages and database sync between k5s"
publish = false
version = "0.1.0"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
k5lib = { path = "../k5lib" }

# Pinned: iroh's API still moves between minor releases.
iroh = { version = "=1.2.0" }
base64 = { version = "0.22" }
hex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
toml = { workspace = true }
