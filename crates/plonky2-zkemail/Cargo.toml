[package]
name = "plonky2-zkemail"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
num-bigint = "0.4"
num-traits = "0.2"
plonky2 = "=1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = { version = "0.10", features = ["compress"] }
[profile.test]
opt-level = 3
