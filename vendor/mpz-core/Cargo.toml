# Vendored `mpz-core` from https://github.com/privacy-scaling-explorations/mpz
# at rev ccc0057 (the revision the workspace uses), with upstream commit
# 3d90b6c (#326) backported: `hybrid-array` 0.3 -> 0.4, so it builds against the
# stable RustCrypto `aes` 0.9 / `cipher` 0.5 that iroh's dependency tree needs.
# See README.md. Replaces the git crate through `[patch]` in the root Cargo.toml.

[package]
name = "mpz-core"
version = "0.1.0-alpha.3"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "mpz_core"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(clmul_armv8)",
    "cfg(clmul_force_soft)",
] }

[features]
default = ["cointoss", "rayon"]
cointoss = ["dep:rand_chacha"]
rayon = ["dep:rayon"]

[dependencies]
aes = { version = "0.9.0-pre.3" }
cipher = { version = "0.5.0-pre.8" }
blake3 = { version = "1.3.3" }
clmul = { git = "https://github.com/privacy-scaling-explorations/mpz", rev = "ccc0057" }
rand = { version = "0.9" }
rand_chacha = { version = "0.9", optional = true }
serde = { version = "1.0", features = ["derive"] }
thiserror = { version = "1" }
once_cell = { version = "1" }
itybity = { version = "0.3" }
opaque-debug = { version = "0.3" }
bcs = { version = "0.1.5" }
rand_core_06 = { package = "rand_core", version = "0.6" }
rand_core = { version = "0.9" }
bytemuck = { version = "1.13", features = ["derive"] }
# Upstream 3d90b6c (#326): was 0.3.
hybrid-array = { version = "0.4" }
rayon = { version = "1", optional = true }
cfg-if = { version = "1" }
bitvec = { version = "1.0", features = ["serde"] }

[dev-dependencies]
rstest = { version = "0.12" }
